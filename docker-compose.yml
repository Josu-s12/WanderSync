services:

  db:
    image: supabase/postgres:15.8.1.060
    container_name: ws-db
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: wandersync
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/migrations/99-wandersync.sql
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -h localhost"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: ws-redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  flights:
    build: ./services/flights
    container_name: ws-flights
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/wandersync
    ports:
      - "8001:8000"
    depends_on:
      db:
        condition: service_healthy

  hotels:
    build: ./services/hotels
    container_name: ws-hotels
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/wandersync
    ports:
      - "8002:8000"
    depends_on:
      db:
        condition: service_healthy

  cars:
    build: ./services/cars
    container_name: ws-cars
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/wandersync
    ports:
      - "8003:8000"
    depends_on:
      db:
        condition: service_healthy

  orders:
    build: ./services/orders
    container_name: ws-orders
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/wandersync
      FLIGHTS_URL: http://flights:8000
      HOTELS_URL: http://hotels:8000
      CARS_URL: http://cars:8000
    ports:
      - "8004:8000"
    depends_on:
      db:
        condition: service_healthy
      flights:
        condition: service_started
      hotels:
        condition: service_started
      cars:
        condition: service_started

  gateway:
    build: ./gateway
    container_name: ws-gateway
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/wandersync
      ORDERS_URL: http://orders:8000
      ALLOW_FAILURE_SIMULATION: "true"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      orders:
        condition: service_started

  mock-source:
    build: ./mock-source
    container_name: ws-mock-source
    environment:
      FAILURE_RATE: "0.2"          # 20% de las peticiones fallan (503 / 429)
      MAX_LATENCY: "1.0"           # segundos
      PRICE_WINDOW_SECONDS: "600"  # los precios cambian cada 10 minutos
    ports:
      - "8080:8000"

volumes:
  pgdata: