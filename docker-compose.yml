# WanderSync Travel Solutions - despliegue completo con un solo comando:
#     docker compose up -d --build
# Las contraseñas tienen valores por defecto SOLO para desarrollo/evaluación local.
# Para usar contraseñas propias, copia .env.example a .env y cámbialas (el .env no se versiona).

services:

  db:
    restart: unless-stopped
    image: supabase/postgres:15.8.1.060
    container_name: ws-db
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wandersync_dev_pg}
      POSTGRES_DB: wandersync
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/migrations/99-wandersync.sql
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -h localhost"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    restart: unless-stopped
    image: redis:7-alpine
    container_name: ws-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-wandersync_dev_redis}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-wandersync_dev_redis}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD --no-auth-warning ping"]
      interval: 5s
      retries: 10

  flights:
    restart: unless-stopped
    build: ./services/flights
    container_name: ws-flights
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-wandersync_dev_pg}@db:5432/wandersync
    depends_on:
      db:
        condition: service_healthy

  hotels:
    restart: unless-stopped
    build: ./services/hotels
    container_name: ws-hotels
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-wandersync_dev_pg}@db:5432/wandersync
    depends_on:
      db:
        condition: service_healthy

  cars:
    restart: unless-stopped
    build: ./services/cars
    container_name: ws-cars
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-wandersync_dev_pg}@db:5432/wandersync
    depends_on:
      db:
        condition: service_healthy

  orders:
    restart: unless-stopped
    build: ./services/orders
    container_name: ws-orders
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-wandersync_dev_pg}@db:5432/wandersync
      FLIGHTS_URL: http://flights:8000
      HOTELS_URL: http://hotels:8000
      CARS_URL: http://cars:8000
      # Observabilidad de la SAGA en Prefect (si Prefect no responde, la SAGA corre igual en modo directo)
      SAGA_PREFECT: "true"
      PREFECT_API_URL: http://prefect-server:4200/api
      PREFECT_UI_URL: http://localhost:4200
      PREFECT_LOGGING_EXTRA_LOGGERS: saga
      PREFECT_LOGGING_TO_API_WHEN_MISSING_FLOW: ignore
    depends_on:
      db:
        condition: service_healthy
      flights:
        condition: service_started
      hotels:
        condition: service_started
      cars:
        condition: service_started

  gateway:
    restart: unless-stopped
    build: ./gateway
    container_name: ws-gateway
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-wandersync_dev_pg}@db:5432/wandersync
      ORDERS_URL: http://orders:8000
      REDIS_URL: redis://:${REDIS_PASSWORD:-wandersync_dev_redis}@redis:6379/0
      ALLOW_FAILURE_SIMULATION: "true"     # solo para la demo; en producción va en "false"
      ENABLE_GRAPHIQL: "true"              # consola GraphiQL para la demo
      COOKIE_SECURE: "false"               # "true" cuando se sirva por HTTPS
      GLOBAL_RATE_LIMIT_PER_MINUTE: "120"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      orders:
        condition: service_started

  frontend:
    restart: unless-stopped
    build: ./frontend
    container_name: ws-frontend
    ports:
      - "3000:8080"      # http://localhost:3000  (el gateway solo es accesible a traves de aqui)
    depends_on:
      gateway:
        condition: service_started

  mock-source:
    restart: unless-stopped
    build: ./mock-source
    container_name: ws-mock-source
    environment:
      FAILURE_RATE: "0.2"          # 20% de las peticiones fallan (503 / 429)
      MAX_LATENCY: "1.0"           # segundos
      PRICE_WINDOW_SECONDS: "600"  # los precios cambian cada 10 minutos
    ports:
      - "8080:8000"

  # ---------------- Orquestación y observabilidad ----------------
  prefect-server:
    restart: unless-stopped
    image: prefecthq/prefect:3.8.8-python3.12
    container_name: ws-prefect
    command: prefect server start --host 0.0.0.0 --port 4200
    environment:
      PREFECT_UI_API_URL: http://localhost:4200/api
    volumes:
      - prefectdata:/root/.prefect
    ports:
      - "4200:4200"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4200/api/health')"]
      interval: 5s
      timeout: 5s
      retries: 30

  # ---------------- Computación distribuida ----------------
  dask-scheduler:
    restart: unless-stopped
    build: ./ingestion
    image: wandersync-ingestion
    container_name: ws-dask-scheduler
    command: dask scheduler --dashboard-address :8787
    ports:
      - "8788:8787"   # dashboard de Dask en http://localhost:8788

  dask-worker:
    restart: unless-stopped
    build: ./ingestion
    image: wandersync-ingestion
    command: dask worker tcp://dask-scheduler:8786 --nthreads 2
    deploy:
      replicas: 2
    environment: &ingestion-env
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-wandersync_dev_pg}@db:5432/wandersync
      SOURCE_URL: http://mock-source:8000
      FLIGHT_SOURCE: "google"      # vuelos reales de Google Flights ("mock" para usar solo la fuente simulada)
      DASK_SCHEDULER_ADDRESS: tcp://dask-scheduler:8786
      PREFECT_API_URL: http://prefect-server:4200/api
    depends_on:
      dask-scheduler:
        condition: service_started
      prefect-server:
        condition: service_healthy

  ingestion:
    restart: unless-stopped
    build: ./ingestion
    image: wandersync-ingestion
    container_name: ws-ingestion
    command: python flow.py
    environment: *ingestion-env
    depends_on:
      db:
        condition: service_healthy
      prefect-server:
        condition: service_healthy
      dask-worker:
        condition: service_started
      mock-source:
        condition: service_started

volumes:
  pgdata:
  prefectdata: